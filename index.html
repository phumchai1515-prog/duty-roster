<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ปฏิทินเวร · เวรตรวจการ</title>
<meta name="theme-color" content="#004d40">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/calendar.css">
<script src="assets/js/env.js"></script>
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>
<div id="shell"></div>

<main id="main">
  <div id="boot" class="empty">
    <div class="spinner" style="margin:0 auto"></div>
    <p class="caption" style="margin-top:12px">กำลังโหลดตารางเวร…</p>
  </div>

  <div id="page" class="hidden">
    <div class="month-bar card rise rise-1">
      <div class="month-nav">
        <button class="btn btn-icon" id="prev-month" type="button" aria-label="เดือนก่อนหน้า"></button>
        <button class="btn btn-icon" id="next-month" type="button" aria-label="เดือนถัดไป"></button>
      </div>
      <div class="month-title">
        <p class="eyebrow">ตารางปฏิบัติงานนอกเวลาราชการ</p>
        <h1 id="month-label">—</h1>
      </div>
      <button class="btn btn-sm" id="today-btn" type="button">เดือนนี้</button>
      <div class="stat-strip" id="stat-strip" aria-label="สรุปเดือนนี้"></div>
    </div>

    <div id="page-alert" class="alert error hidden" role="alert"></div>
    <div id="month-notice" class="alert warn hidden" role="status"></div>

    <div class="mode-switch card rise rise-2" role="group" aria-label="เลือกสิ่งที่ต้องการทำ">
      <button type="button" class="mode-btn" id="mode-shift" aria-pressed="true">
        จองเวร
        <small>เลือกวันที่ต้องการขึ้นเวร</small>
      </button>
      <button type="button" class="mode-btn" id="mode-off" aria-pressed="false">
        แจ้ง OFF
        <small>เลือกวันที่ขึ้นเวรไม่ได้</small>
      </button>
    </div>

    <div class="legend card rise rise-2" role="list" aria-label="ความหมายของสัญลักษณ์">
      <span class="legend-item" role="listitem"><span class="legend-swatch mine"></span>เวรของฉัน</span>
      <span class="legend-item" role="listitem"><span class="legend-swatch taken"></span>มีผู้จองแล้ว</span>
      <span class="legend-item" role="listitem"><span class="legend-swatch"></span>ว่าง — กดเพื่อจอง</span>
      <span class="legend-item" role="listitem"><span class="legend-swatch off"></span>OFF ของฉัน</span>
      <span class="legend-item" role="listitem"><span class="legend-swatch holiday"></span>วันหยุดราชการ</span>
      <span class="legend-item" role="listitem"><span class="legend-swatch today"></span>วันนี้</span>
    </div>

    <section class="card calendar-card rise rise-3" aria-labelledby="month-label">
      <div class="dow-head" id="dow-head" aria-hidden="true"></div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>
  </div>
</main>

<!-- กล่องยืนยันการจอง -->
<div id="sheet-backdrop" class="sheet-backdrop hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheet-title">—</h2>
    <p class="caption" id="sheet-sub">—</p>
    <div id="sheet-body" class="stack"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="sheet-close" type="button">ปิด</button>
      <button class="btn btn-primary" id="sheet-confirm" type="button">ยืนยันจองเวร</button>
    </div>
  </div>
</div>

<div id="toast-region" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/calendar-page.js"></script>
</body>
</html>
