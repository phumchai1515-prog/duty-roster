<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ · เวรตรวจการ</title>
<meta name="theme-color" content="#004d40">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">
<script src="assets/js/env.js"></script>
</head>
<body class="login-body">
<main class="login-shell">
  <div class="login-card card" id="login-card">
    <div class="login-head">
      <img class="login-crest" src="assets/icons/logo.png" width="74" height="74"
           alt="ตราโรงพยาบาลจิตเวชเลยราชนครินทร์">
      <p class="login-org">โรงพยาบาลจิตเวชเลยราชนครินทร์</p>
      <h1>ระบบจองเวรตรวจการ</h1>
      <p class="login-sub">ตารางปฏิบัติงานนอกเวลาราชการและในวันหยุดราชการ</p>
    </div>

    <div class="login-body-area">
      <div id="login-error" class="alert error hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="nurse-select">ชื่อ-นามสกุล</label>
          <select id="nurse-select" name="nurse" required autocomplete="username">
            <option value="">— กำลังโหลดรายชื่อ —</option>
          </select>
          <p class="field-hint">เลือกชื่อของคุณจากรายชื่อผู้ขึ้นเวรตรวจการ</p>
        </div>

        <div class="field">
          <label for="pin-input">รหัส PIN (6 หลัก)</label>
          <input
            id="pin-input" name="pin" type="password" inputmode="numeric"
            autocomplete="current-password" maxlength="6" pattern="\d{6}"
            placeholder="••••••" class="pin-input" required>
          <p class="field-hint">เข้าครั้งแรกใช้ PIN ที่ผู้ดูแลระบบแจ้ง แล้วระบบจะให้ตั้งใหม่</p>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <p class="login-foot caption">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    ลืมรหัส PIN? ติดต่อผู้ดูแลระบบเพื่อรีเซ็ต
  </p>
</main>

<script type="module" src="assets/js/login.js"></script>
</body>
</html>
